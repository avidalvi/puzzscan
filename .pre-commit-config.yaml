repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: python -m scripts.local_precommit_checks trailing-whitespace
        language: system
        types_or: [text]

      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: python -m scripts.local_precommit_checks end-of-file-fixer
        language: system
        types_or: [text]

      - id: check-yaml
        name: check-yaml
        entry: python -m scripts.local_precommit_checks check-yaml
        language: system
        files: \.(yaml|yml)$

      - id: check-added-large-files
        name: check-added-large-files
        entry: python -m scripts.local_precommit_checks check-added-large-files
        language: system
        pass_filenames: true

      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types_or: [python, pyi]

      - id: detect-secrets
        name: detect-secrets
        entry: python -m scripts.local_precommit_checks detect-secrets-baseline
        language: system
        pass_filenames: false
        exclude: .*/tests/.*|^\.secrets\.baseline$
